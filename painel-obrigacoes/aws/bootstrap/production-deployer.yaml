AWSTemplateFormatVersion: '2010-09-09'
Description: Fronteira IAM para deploy do E3I Painel de Obrigacoes em producao

Parameters:
  AccountId:
    Type: String

Resources:
  ProductionDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: e3i-production-deployer
      Description: Deploy limitado dos recursos E3I do Painel de Obrigacoes em producao
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AccountId}:user/e3i-platform-admin
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
      Policies:
        - PolicyName: e3i-production-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ProductionStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:ListChangeSets
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:*:${AccountId}:stack/e3i-prod-*/*
              - Sid: ValidateTemplatesReadOnly
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: UseAwsServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31
              - Sid: ProductionDynamoDb
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:ListTagsOfResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:UpdateContinuousBackups
                  - dynamodb:UpdateTable
                Resource: !Sub arn:${AWS::Partition}:dynamodb:*:${AccountId}:table/e3i-prod-*
              - Sid: ProductionLambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:*:${AccountId}:function:e3i-prod-*
              - Sid: ProductionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:DescribeLogGroups
                  - logs:PutRetentionPolicy
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:*:${AccountId}:log-group:/aws/lambda/e3i-prod-*
                  - !Sub 'arn:${AWS::Partition}:logs:*:${AccountId}:log-group:/aws/lambda/e3i-prod-*:*'
              - Sid: ApiGatewayDeployment
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource: !Sub arn:${AWS::Partition}:apigateway:*::/*
              - Sid: ProductionMonitoring
                Effect: Allow
                Action:
                  - xray:GetSamplingRules
                  - xray:GetSamplingStatisticSummaries
                  - xray:PutTelemetryRecords
                  - xray:PutTraceSegments
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:TagResource
                  - cloudwatch:UntagResource
                Resource: '*'
              - Sid: ProductionIdentityAndNotifications
                Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:ListTagsForResource
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:UpdateUserPoolClient
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                  - scheduler:ListSchedules
                  - scheduler:UpdateSchedule
                  - ses:CreateEmailIdentity
                  - ses:DeleteEmailIdentity
                  - ses:GetAccount
                  - ses:GetEmailIdentity
                  - ses:ListEmailIdentities
                Resource: '*'
              - Sid: ProductionBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:GetBucketEncryption
                  - s3:PutBucketEncryption
                  - s3:GetBucketCORS
                  - s3:PutBucketCORS
                  - s3:DeleteBucketCORS
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:DeleteBucketOwnershipControls
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource: arn:aws:s3:::e3i-prod-*
              - Sid: ProductionArtifactsBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:${AWS::Partition}:s3:::e3i-prod-artifacts-${AccountId}
              - Sid: ProductionArtifactsObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::e3i-prod-artifacts-${AccountId}/*
              - Sid: ProductionLambdaRoles
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${AccountId}:role/e3i-prod-*-api
                  - !Sub arn:${AWS::Partition}:iam::${AccountId}:role/e3i-prod-*-notifications
                  - !Sub arn:${AWS::Partition}:iam::${AccountId}:role/e3i-prod-*-notification-scheduler
              - Sid: ProductionBudget
                Effect: Allow
                Action:
                  - budgets:CreateBudget
                  - budgets:DeleteBudget
                  - budgets:DescribeBudget
                  - budgets:ModifyBudget
                  - budgets:ViewBudget
                Resource: '*'
              - Sid: PreventDeployerMutation
                Effect: Deny
                Action: iam:*
                Resource: !Sub arn:${AWS::Partition}:iam::${AccountId}:role/e3i-production-deployer

Outputs:
  RoleArn:
    Value: !GetAtt ProductionDeployerRole.Arn
