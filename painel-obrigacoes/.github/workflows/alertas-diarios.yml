name: Alertas diários de obrigações

on:
  workflow_dispatch: {}

jobs:
  validar-alertas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: npm ci --ignore-scripts

      - name: Validate the Scheduler/Lambda alert implementation
        run: node --test aws/api/test/notifications.test.mjs
