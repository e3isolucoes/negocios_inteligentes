name: Portal Container App Deploy

on:
  push:
    branches: [main]
    paths:
      - 'portal-admin/**'
      - '.github/workflows/portal-containerapp-deploy.yml'
  workflow_dispatch:

concurrency:
  group: portal-containerapp-test
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_REGISTRY_NAME: acre3i431811
  AZURE_REGISTRY_SERVER: acre3i431811.azurecr.io
  PORTAL_IMAGE_REPOSITORY: e3i-portal
  PORTAL_CONTAINER_APP: e3i-portal-test
  PORTAL_RESOURCE_GROUP: rg-e3i-portal-test

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate portal auth patch
        run: |
          node --check portal-admin/patch-session-probe.cjs
          node --check portal-admin/test-session-probe.cjs
          node portal-admin/test-session-probe.cjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: portal-test
    steps:
      - uses: actions/checkout@v7

      - name: Require Azure OIDC identifiers
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_TENANT_ID"
          test -n "$AZURE_SUBSCRIPTION_ID"

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build patched Portal image in ACR
        id: image
        shell: bash
        run: |
          set -euo pipefail
          TAG="ni-${GITHUB_SHA::12}"
          IMAGE="$AZURE_REGISTRY_SERVER/$PORTAL_IMAGE_REPOSITORY:$TAG"
          az acr build \
            --registry "$AZURE_REGISTRY_NAME" \
            --image "$PORTAL_IMAGE_REPOSITORY:$TAG" \
            --file portal-admin/Dockerfile \
            portal-admin
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy image to Azure Container App
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$PORTAL_CONTAINER_APP" \
            --resource-group "$PORTAL_RESOURCE_GROUP" \
            --image "${{ steps.image.outputs.image }}"

      - name: Verify deployed revision
        id: portal
        shell: bash
        run: |
          set -euo pipefail
          FQDN="$(az containerapp show \
            --name "$PORTAL_CONTAINER_APP" \
            --resource-group "$PORTAL_RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' \
            --output tsv)"
          LATEST_REVISION="$(az containerapp show \
            --name "$PORTAL_CONTAINER_APP" \
            --resource-group "$PORTAL_RESOURCE_GROUP" \
            --query 'properties.latestRevisionName' \
            --output tsv)"
          DEPLOYED_IMAGE="$(az containerapp show \
            --name "$PORTAL_CONTAINER_APP" \
            --resource-group "$PORTAL_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' \
            --output tsv)"

          test -n "$FQDN"
          test "$DEPLOYED_IMAGE" = "${{ steps.image.outputs.image }}"

          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "latest_revision=$LATEST_REVISION" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: $LATEST_REVISION"
          echo "Deployed image: $DEPLOYED_IMAGE"
          echo "Container App FQDN: $FQDN"

      - name: Smoke test deployed Container App
        shell: bash
        env:
          PORTAL_FQDN: ${{ steps.portal.outputs.fqdn }}
        run: |
          set -euo pipefail
          URL="https://$PORTAL_FQDN/api/auth/session"

          for attempt in {1..12}; do
            status="$(curl -sS -o /tmp/session.json -w '%{http_code}' "$URL" || true)"
            if [ "$status" = "200" ]; then
              node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/session.json','utf8')); if(p.authenticated!==false) process.exit(1)"
              echo "Deployed Container App anonymous session probe is healthy."
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $status from $URL"
            sleep 10
          done

          echo "Deployed Container App did not expose the corrected anonymous session contract."
          cat /tmp/session.json || true
          exit 1

      - name: Check public Portal domain routing
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/public-session.json -w '%{http_code}' https://portal.e3isolucoes.com.br/api/auth/session || true)"
          echo "portal.e3isolucoes.com.br returned HTTP $status"
          cat /tmp/public-session.json || true

          if [ "$status" != "200" ]; then
            echo "::warning::The public Portal domain is not exposing the same anonymous-session contract as the deployed test Container App. Check custom-domain/DNS/traffic routing."
            exit 1
          fi

          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/public-session.json','utf8')); if(p.authenticated!==false) process.exit(1)"
