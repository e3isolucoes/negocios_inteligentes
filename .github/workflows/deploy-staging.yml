name: Deploy AWS staging
# release-trigger: canonical-consolidation-20260920

on:
  push:
    branches:
      - deploy/staging

permissions:
  contents: read

concurrency:
  group: aws-staging
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  STACK_NAME: e3i-staging-painel-obrigacoes
  EXPECTED_USER_POOL_ID: sa-east-1_cc1svByQA
  EXPECTED_API_ID: oezgdex1li

jobs:
  deploy:
    name: validate-and-deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: painel-obrigacoes/aws/api
    steps:
      - name: Checkout staging candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run API tests
        run: npm test

      - name: Run platform tests
        run: npm test
        working-directory: .

      - name: Build Lambda bundles
        run: npm run build

      - name: Validate SAM template
        run: sam validate --lint --template-file template.yaml
        working-directory: painel-obrigacoes/aws

      - name: Diagnose AWS credential shape
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo "AWS_ACCESS_KEY_ID ausente"; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo "AWS_SECRET_ACCESS_KEY ausente"; exit 1; }

          case "$AWS_ACCESS_KEY_ID" in
            AKIA*) echo "Tipo detectado: credencial IAM de longa duração (AKIA).";;
            ASIA*) echo "Tipo detectado: credencial temporária STS/SSO (ASIA).";;
            *) echo "Tipo detectado: prefixo de Access Key não reconhecido.";;
          esac

          if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
            echo "AWS_SESSION_TOKEN: presente."
          else
            echo "AWS_SESSION_TOKEN: ausente."
          fi

          if [[ "$AWS_ACCESS_KEY_ID" == ASIA* && -z "${AWS_SESSION_TOKEN:-}" ]]; then
            echo "Credencial ASIA exige AWS_SESSION_TOKEN do mesmo conjunto."
            exit 1
          fi

          if [[ "$AWS_ACCESS_KEY_ID" == AKIA* && -n "${AWS_SESSION_TOKEN:-}" ]]; then
            echo "Credencial AKIA normalmente não deve ser combinada com AWS_SESSION_TOKEN. Remova o token se ele não pertencer ao mesmo conjunto."
          fi
        working-directory: .

      - name: Verify AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: aws sts get-caller-identity
        working-directory: .

      - name: Verify existing staging stack identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          aws cloudformation describe-stacks             --region "$AWS_REGION"             --stack-name "$STACK_NAME" >/tmp/stack.json

          USER_POOL_ID="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/stack.json'))
          outputs={x['OutputKey']:x.get('OutputValue','') for x in data['Stacks'][0].get('Outputs',[])}
          print(outputs.get('CognitoUserPoolId',''))
          PY
          )"

          API_URL="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/stack.json'))
          outputs={x['OutputKey']:x.get('OutputValue','') for x in data['Stacks'][0].get('Outputs',[])}
          print(outputs.get('ApiUrl',''))
          PY
          )"

          test "$USER_POOL_ID" = "$EXPECTED_USER_POOL_ID" || {
            echo "Stack recusado: UserPool inesperado: $USER_POOL_ID"
            exit 1
          }

          echo "$API_URL" | grep -q "$EXPECTED_API_ID" || {
            echo "Stack recusado: API inesperada: $API_URL"
            exit 1
          }

          FILES_BUCKET="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/stack.json'))
          outputs={x['OutputKey']:x.get('OutputValue','') for x in data['Stacks'][0].get('Outputs',[])}
          print(outputs.get('FilesBucketName',''))
          PY
          )"

          test -n "$FILES_BUCKET" || {
            echo "Stack recusado: FilesBucketName ausente."
            exit 1
          }

          echo "SAM_ARTIFACT_BUCKET=$FILES_BUCKET" >> "$GITHUB_ENV"
          echo "Stack de staging confirmado: $STACK_NAME"
          echo "Bucket de artefatos temporário: output FilesBucketName (prefixo _sam/staging)"
        working-directory: .

      - name: Recover interrupted CloudFormation rollback
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          STATUS="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text)"

          if [ "$STATUS" != "UPDATE_ROLLBACK_FAILED" ]; then
            echo "Stack não requer recuperação: $STATUS"
            exit 0
          fi

          echo "Stack em UPDATE_ROLLBACK_FAILED; iniciando continue-update-rollback."
          aws cloudformation continue-update-rollback \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME"

          for attempt in $(seq 1 60); do
            STATUS="$(aws cloudformation describe-stacks \
              --region "$AWS_REGION" \
              --stack-name "$STACK_NAME" \
              --query 'Stacks[0].StackStatus' \
              --output text)"

            case "$STATUS" in
              UPDATE_ROLLBACK_COMPLETE)
                echo "Rollback recuperado com sucesso."
                exit 0
                ;;
              UPDATE_ROLLBACK_FAILED|ROLLBACK_FAILED)
                echo "Rollback continua em estado de falha: $STATUS"
                echo "Eventos recentes de falha:"
                aws cloudformation describe-stack-events \
                  --region "$AWS_REGION" \
                  --stack-name "$STACK_NAME" \
                  --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
                  --output table || true
                exit 1
                ;;
              UPDATE_ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS)
                echo "Aguardando recuperação: $STATUS"
                sleep 10
                ;;
              *)
                echo "Estado inesperado durante recuperação: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "Timeout aguardando recuperação do rollback."
          exit 1
        working-directory: .

      - name: Prepare staged compatibility templates
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          aws cloudformation get-template \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-stage Original \
            --output json >/tmp/current-original-template.json

          aws cloudformation get-template \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --template-stage Processed \
            --output json >/tmp/current-processed-template.json

          TABLE_NAME="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='TableName'].OutputValue | [0]" \
            --output text)"

          aws dynamodb describe-table \
            --region "$AWS_REGION" \
            --table-name "$TABLE_NAME" \
            --output json >/tmp/current-table.json

          ALARM_NAME="$(aws cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --logical-resource-id DeletionDeadLetterAlarm \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          aws cloudwatch describe-alarms \
            --region "$AWS_REGION" \
            --alarm-names "$ALARM_NAME" \
            --output json >/tmp/current-deletion-alarm.json

          SCHEDULE_NAME="$(aws cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --logical-resource-id NotificationSchedule \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          aws scheduler get-schedule \
            --region "$AWS_REGION" \
            --name "$SCHEDULE_NAME" \
            --output json >/tmp/current-notification-schedule.json

          python - <<'PY'
          import copy
          import json
          import re
          from pathlib import Path

          import yaml

          source_path = Path('painel-obrigacoes/aws/template.yaml')
          source = source_path.read_text()

          class CfnLoader(yaml.SafeLoader):
              pass

          def construct_cfn(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  value = loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode):
                  value = loader.construct_sequence(node)
              else:
                  value = loader.construct_mapping(node)
              if tag_suffix == 'Ref':
                  return {'Ref': value}
              if tag_suffix == 'GetAtt' and isinstance(value, str):
                  value = value.split('.', 1)
              return {f'Fn::{tag_suffix}': value}

          CfnLoader.add_multi_constructor('!', construct_cfn)

          def read_template(path):
              payload = json.load(open(path))
              body = payload.get('TemplateBody', {})
              if isinstance(body, dict):
                  return body
              if isinstance(body, str):
                  parsed = yaml.load(body, Loader=CfnLoader)
                  if isinstance(parsed, dict):
                      return parsed
              raise SystemExit(f'Não foi possível interpretar TemplateBody de {path}.')

          original = read_template('/tmp/current-original-template.json')
          processed = read_template('/tmp/current-processed-template.json')
          deployed = original.get('Resources', {})
          processed_resources = processed.get('Resources', {})

          table_state = json.load(open('/tmp/current-table.json'))['Table']
          table_arn = table_state['TableArn']
          stream_arn = table_state.get('LatestStreamArn')
          if not stream_arn:
              raise SystemExit('LatestStreamArn ausente; não é seguro congelar dependências da fase 1.')

          alarm_state = json.load(open('/tmp/current-deletion-alarm.json'))
          alarms = alarm_state.get('MetricAlarms', [])
          if len(alarms) != 1:
              raise SystemExit('Não foi possível resolver exatamente um DeletionDeadLetterAlarm.')
          live_alarm_description = alarms[0].get('AlarmDescription', '')

          schedule_state = json.load(open('/tmp/current-notification-schedule.json'))
          live_schedule_description = schedule_state.get('Description', '')

          def freeze_datatable_references(value):
              if isinstance(value, list):
                  return [freeze_datatable_references(item) for item in value]
              if isinstance(value, dict):
                  if value == {'Fn::GetAtt': ['DataTable', 'Arn']}:
                      return table_arn
                  if value == {'Fn::GetAtt': ['DataTable', 'StreamArn']}:
                      return stream_arn
                  return {
                      key: freeze_datatable_references(item)
                      for key, item in value.items()
                  }
              if isinstance(value, str):
                  return (
                      value
                      .replace('${DataTable.Arn}', table_arn)
                      .replace('${DataTable.StreamArn}', stream_arn)
                  )
              return value
          for required in ('DataTable', 'FilesBucket'):
              if required not in deployed:
                  raise SystemExit(f'Recurso original implantado obrigatório ausente: {required}')

          protected = {
              key: value for key, value in processed_resources.items()
              if key.startswith('Deletion')
          }
          if not protected:
              raise SystemExit('Nenhum recurso Deletion* encontrado no stack atual; abortando por segurança.')

          def ensure_attribute(table, name):
              attrs = table['Properties'].setdefault('AttributeDefinitions', [])
              if not any(item.get('AttributeName') == name for item in attrs):
                  attrs.append({'AttributeName': name, 'AttributeType': 'S'})

          def ensure_gsi(table, name, hash_key, range_key):
              gsis = table['Properties'].setdefault('GlobalSecondaryIndexes', [])
              if any(item.get('IndexName') == name for item in gsis):
                  return
              gsis.append({
                  'IndexName': name,
                  'KeySchema': [
                      {'AttributeName': hash_key, 'KeyType': 'HASH'},
                      {'AttributeName': range_key, 'KeyType': 'RANGE'},
                  ],
                  'Projection': {'ProjectionType': 'ALL'},
                  'ProvisionedThroughput': {
                      'ReadCapacityUnits': 1,
                      'WriteCapacityUnits': 1,
                  },
              })

          def table_for(phase, base=None):
              table = copy.deepcopy(base if base is not None else deployed['DataTable'])
              # Preserve every deployed table property, especially StreamSpecification.
              ensure_attribute(table, 'GSIRecordPK')
              ensure_attribute(table, 'GSIRecordSK')
              ensure_gsi(table, 'GSI-RECORD-LOOKUP', 'GSIRecordPK', 'GSIRecordSK')
              if phase == 2:
                  ensure_attribute(table, 'GSIDueDatePK')
                  ensure_attribute(table, 'GSIDueDateSK')
                  ensure_gsi(table, 'GSI-DUEDATE', 'GSIDueDatePK', 'GSIDueDateSK')
              return table

          def yaml_json_resource(name, resource):
              encoded = json.dumps(resource, indent=2, separators=(',', ': '))
              lines = encoded.splitlines()
              return '  ' + name + ': ' + lines[0] + '\n' + '\n'.join('  ' + line for line in lines[1:])

          def replace_resource(text, name, resource):
              pattern = re.compile(
                  rf'^  {re.escape(name)}:\n.*?(?=^  [A-Za-z0-9][A-Za-z0-9]*:\n|^Outputs:\n)',
                  re.MULTILINE | re.DOTALL,
              )
              block = yaml_json_resource(name, resource) + '\n\n'
              updated, count = pattern.subn(block, text, count=1)
              if count != 1:
                  raise SystemExit(f'Não foi possível substituir {name} no template candidato.')
              return updated

          def upsert_resource(text, name, resource):
              pattern = re.compile(
                  rf'^  {re.escape(name)}:\n',
                  re.MULTILINE,
              )
              if pattern.search(text):
                  return replace_resource(text, name, resource)
              if '\nOutputs:\n' not in text:
                  raise SystemExit('Seção Outputs não encontrada para inserir recurso preservado.')
              block = '\n' + yaml_json_resource(name, resource) + '\n'
              return text.replace('\nOutputs:\n', block + '\nOutputs:\n', 1)

          def build_final():
              text = source

              # DynamoDB GSIs are migrated out-of-band in staging. Keep the stack's
              # deployed DataTable definition untouched to avoid dependency churn.
              text = replace_resource(
                  text,
                  'DataTable',
                  copy.deepcopy(processed_resources['DataTable']),
              )
              text = replace_resource(
                  text,
                  'FilesBucket',
                  copy.deepcopy(processed_resources['FilesBucket']),
              )

              # Notification infrastructure is outside the scope of this migration.
              # Preserve the currently deployed processed definitions so the change
              # set cannot rewrite them because Globals changed in the new template.
              notification_names = [
                  'NotificationEmailIdentity',
                  'NotificationFunction',
                  'NotificationExecutionRole',
                  'NotificationLogGroup',
                  'NotificationSchedulerRole',
                  'NotificationSchedule',
                  'NotificationDeliveryFailuresAlarm',
              ]
              for name in notification_names:
                  if name in processed_resources:
                      text = upsert_resource(
                          text,
                          name,
                          copy.deepcopy(processed_resources[name]),
                      )

              protected_blocks = '\n\n'.join(
                  yaml_json_resource(name, resource)
                  for name, resource in sorted(protected.items())
              )
              if '\nOutputs:\n' not in text:
                  raise SystemExit('Seção Outputs não encontrada.')
              text = text.replace(
                  '\nOutputs:\n',
                  '\n' + protected_blocks + '\n\nOutputs:\n',
                  1,
              )
              return text

          Path('painel-obrigacoes/aws/template-staging-final.yaml').write_text(
              build_final()
          )

          print('Template final de staging preparado.')
          print('DataTable do CloudFormation preservado; GSIs serão migrados diretamente no DynamoDB.')
          print('Recursos Deletion* preservados:', ', '.join(sorted(protected)))
          print('Preservação baseada no template Original do stack.')
          print('StreamSpecification preservado:', 'StreamSpecification' in deployed['DataTable'].get('Properties', {}))
          print('Recursos processados conferidos:', len(processed_resources))
          PY
        working-directory: .

      - name: Validate staged template
        run: |
          set -euo pipefail
          sam validate --lint --template-file template-staging-final.yaml
        working-directory: painel-obrigacoes/aws

      - name: Ensure staging DynamoDB indexes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          TABLE_NAME="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='TableName'].OutputValue | [0]" \
            --output text)"

          ensure_index() {
            local index_name="$1"
            local hash_key="$2"
            local range_key="$3"

            local status
            status="$(aws dynamodb describe-table \
              --region "$AWS_REGION" \
              --table-name "$TABLE_NAME" \
              --query "Table.GlobalSecondaryIndexes[?IndexName=='$index_name'].IndexStatus | [0]" \
              --output text)"

            if [ "$status" = "ACTIVE" ]; then
              echo "$index_name já está ACTIVE."
              return 0
            fi

            if [ "$status" = "CREATING" ] || [ "$status" = "UPDATING" ]; then
              echo "$index_name já existe e está $status; aguardando."
            elif [ "$status" = "None" ] || [ -z "$status" ]; then
              echo "Criando $index_name diretamente no DynamoDB."
              aws dynamodb update-table \
                --region "$AWS_REGION" \
                --table-name "$TABLE_NAME" \
                --attribute-definitions \
                  "AttributeName=$hash_key,AttributeType=S" \
                  "AttributeName=$range_key,AttributeType=S" \
                --global-secondary-index-updates \
                  "[{\"Create\":{\"IndexName\":\"$index_name\",\"KeySchema\":[{\"AttributeName\":\"$hash_key\",\"KeyType\":\"HASH\"},{\"AttributeName\":\"$range_key\",\"KeyType\":\"RANGE\"}],\"Projection\":{\"ProjectionType\":\"ALL\"},\"ProvisionedThroughput\":{\"ReadCapacityUnits\":1,\"WriteCapacityUnits\":1}}}]" \
                >/tmp/update-table.json
            else
              echo "Estado inesperado de $index_name: $status"
              exit 1
            fi

            for attempt in $(seq 1 120); do
              status="$(aws dynamodb describe-table \
                --region "$AWS_REGION" \
                --table-name "$TABLE_NAME" \
                --query "Table.GlobalSecondaryIndexes[?IndexName=='$index_name'].IndexStatus | [0]" \
                --output text)"
              if [ "$status" = "ACTIVE" ]; then
                echo "$index_name ACTIVE."
                return 0
              fi
              echo "Aguardando $index_name: $status"
              sleep 10
            done

            echo "Timeout aguardando $index_name ficar ACTIVE."
            exit 1
          }

          ensure_index "GSI-RECORD-LOOKUP" "GSIRecordPK" "GSIRecordSK"
          ensure_index "GSI-DUEDATE" "GSIDueDatePK" "GSIDueDateSK"

          echo "GSIs de staging concluídos. Observação: índices estão intencionalmente em drift controlado do template CloudFormation."
        working-directory: .

      - name: Verify staging DynamoDB indexes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          TABLE_NAME="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='TableName'].OutputValue | [0]" \
            --output text)"

          for index_name in GSI-RECORD-LOOKUP GSI-DUEDATE; do
            STATUS="$(aws dynamodb describe-table \
              --region "$AWS_REGION" \
              --table-name "$TABLE_NAME" \
              --query "Table.GlobalSecondaryIndexes[?IndexName=='$index_name'].IndexStatus | [0]" \
              --output text)"
            test "$STATUS" = "ACTIVE" || {
              echo "$index_name não está ACTIVE: $STATUS"
              exit 1
            }
            echo "$index_name ACTIVE."
          done
        working-directory: .

      - name: Create guarded final staging change set
        id: full_stack_deploy
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          sam package \
            --template-file template-staging-final.yaml \
            --s3-bucket "$SAM_ARTIFACT_BUCKET" \
            --s3-prefix "_sam/staging/final" \
            --region "$AWS_REGION" \
            --output-template-file packaged-staging-final.yaml

          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --output json >/tmp/final-stack.json

          python - <<'PY' >/tmp/final-parameters.json
          import json
          data=json.load(open('/tmp/final-stack.json'))
          params=data['Stacks'][0].get('Parameters', [])
          result=[]
          for p in params:
              key=p['ParameterKey']
              if key == 'AllowedOrigin':
                  result.append({'ParameterKey': key, 'ParameterValue': 'https://obrigacoes.e3isolucoes.com.br'})
              else:
                  result.append({'ParameterKey': key, 'UsePreviousValue': True})
          print(json.dumps(result))
          PY

          aws s3 cp packaged-staging-final.yaml \
            "s3://$SAM_ARTIFACT_BUCKET/_sam/staging/final/packaged-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"

          TEMPLATE_URL="https://${SAM_ARTIFACT_BUCKET}.s3.${AWS_REGION}.amazonaws.com/_sam/staging/final/packaged-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          CHANGE_SET="final-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          aws cloudformation create-change-set \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET" \
            --change-set-type UPDATE \
            --template-url "$TEMPLATE_URL" \
            --parameters file:///tmp/final-parameters.json \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND

          set +e
          aws cloudformation wait change-set-create-complete \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET"
          WAIT_STATUS=$?
          set -e

          aws cloudformation describe-change-set \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET" \
            --output json >/tmp/final-changeset.json

          if [ "$WAIT_STATUS" -ne 0 ]; then
            STATUS="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/final-changeset.json'))
          print(data.get('Status',''))
          PY
          )"
            REASON="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/final-changeset.json'))
          print(data.get('StatusReason',''))
          PY
          )"
            if [ "$STATUS" = "FAILED" ] && echo "$REASON" | grep -Eqi "did.?t contain changes|no updates|no changes"; then
              echo "Change Set final vazio; stack já está no estado desejado."
              exit 0
            fi
            echo "Falha ao criar Change Set final: $STATUS - $REASON"
            exit 1
          fi

          python - <<'PY'
          import json
          data=json.load(open('/tmp/final-changeset.json'))
          changes=data.get('Changes', [])
          if not changes:
              raise SystemExit('Change Set final vazio; abortando para inspeção.')

          critical={'DataTable','FilesBucket','UserPool','ServerlessHttpApi'}
          bad=[]
          for change in changes:
              rc=change.get('ResourceChange', {})
              logical=rc.get('LogicalResourceId')
              action=rc.get('Action')
              replacement=rc.get('Replacement')
              rtype=rc.get('ResourceType')
              print(f'Final change: {action} {logical} {rtype} replacement={replacement}')

              if action == 'Remove':
                  bad.append(('remove', logical, rtype))
              if logical in ('DataTable','FilesBucket') and action != 'Dynamic':
                  if action in ('Modify','Remove','Add'):
                      bad.append(('protected-storage-change', logical, action, replacement))
              if logical in critical and replacement in ('True','Conditional'):
                  bad.append(('critical-replacement', logical, replacement))

          if bad:
              print('CHANGE SET FINAL BLOQUEADO:', json.dumps(bad, indent=2))
              raise SystemExit(2)

          print('Guardrail final aprovado: sem remoções e sem alteração/replacement de DataTable/FilesBucket.')
          PY

          aws cloudformation execute-change-set \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET"

          aws cloudformation wait stack-update-complete \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME"
        working-directory: painel-obrigacoes/aws

      - name: Diagnose full stack rollback
        if: steps.full_stack_deploy.outcome == 'failure'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          echo "::warning::O deploy completo do stack falhou e sofreu rollback. A correção operacional da API será aplicada de forma isolada."
          aws cloudformation describe-stack-events \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --max-items 80 \
            --query "StackEvents[?ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table || true

          {
            echo "### Staging: fallback operacional"
            echo ""
            echo "O update completo do CloudFormation sofreu rollback."
            echo "A pipeline seguirá com atualização isolada da Lambda/API e CORS, sem tocar Cognito, DynamoDB, S3 ou schedules."
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: .

      - name: Apply isolated API and CORS hotfix
        if: steps.full_stack_deploy.outcome == 'failure'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          FUNCTION_NAME="e3i-staging-painel-obrigacoes-api"
          OFFICIAL_ORIGIN="https://obrigacoes.e3isolucoes.com.br"
          PREVIEW_ORIGIN="$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Parameters[?ParameterKey=='PreviewOrigin'].ParameterValue | [0]" \
            --output text)"
          if [ -z "$PREVIEW_ORIGIN" ] || [ "$PREVIEW_ORIGIN" = "None" ]; then
            PREVIEW_ORIGIN="https://black-mud-078f1a310-103.centralus.7.azurestaticapps.net"
          fi

          test -s painel-obrigacoes/aws/api/dist/handler.js || {
            echo "Bundle handler.js não encontrado."
            exit 1
          }

          rm -f /tmp/e3i-api-hotfix.zip
          (
            cd painel-obrigacoes/aws/api/dist
            zip -q /tmp/e3i-api-hotfix.zip handler.js
          )

          aws lambda update-function-code \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb:///tmp/e3i-api-hotfix.zip \
            >/tmp/api-hotfix-update.json

          aws lambda wait function-updated \
            --region "$AWS_REGION" \
            --function-name "$FUNCTION_NAME"

          python - "$EXPECTED_API_ID" "$OFFICIAL_ORIGIN" "$PREVIEW_ORIGIN" <<'PY' >/tmp/api-cors.json
          import json, sys
          api_id, official, preview = sys.argv[1:]
          print(json.dumps({
              "ApiId": api_id,
              "CorsConfiguration": {
                  "AllowCredentials": True,
                  "AllowHeaders": ["authorization", "content-type", "x-workspace-id"],
                  "AllowMethods": ["GET", "POST", "PATCH", "DELETE", "OPTIONS"],
                  "AllowOrigins": [official, preview],
                  "MaxAge": 600,
              },
          }))
          PY

          aws apigatewayv2 update-api \
            --region "$AWS_REGION" \
            --cli-input-json file:///tmp/api-cors.json \
            >/tmp/api-cors-update.json

          for attempt in $(seq 1 30); do
            CURRENT="$(aws lambda get-function-configuration \
              --region "$AWS_REGION" \
              --function-name "$FUNCTION_NAME" \
              --query 'LastUpdateStatus' \
              --output text)"
            if [ "$CURRENT" = "Successful" ]; then
              echo "Lambda API atualizada com sucesso."
              break
            fi
            if [ "$CURRENT" = "Failed" ]; then
              echo "Atualização isolada da Lambda falhou."
              aws lambda get-function-configuration \
                --region "$AWS_REGION" \
                --function-name "$FUNCTION_NAME" \
                --output json
              exit 1
            fi
            sleep 2
          done

          echo "::warning::Hotfix operacional aplicado fora do change set completo. O drift de infraestrutura continua registrado para reconciliação separada."
        working-directory: .

      - name: Verify stack update
        if: steps.full_stack_deploy.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail

          STATUS="$(aws cloudformation describe-stacks             --region "$AWS_REGION"             --stack-name "$STACK_NAME"             --query 'Stacks[0].StackStatus'             --output text)"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "Status inesperado após deploy: $STATUS"
              exit 1
              ;;
          esac

          PRE_TOKEN="$(aws cloudformation describe-stacks             --region "$AWS_REGION"             --stack-name "$STACK_NAME"             --query "Stacks[0].Outputs[?OutputKey=='PreTokenGenerationFunctionName'].OutputValue | [0]"             --output text)"

          test -n "$PRE_TOKEN" && test "$PRE_TOKEN" != "None" || {
            echo "Lambda Pre Token Generation não encontrada nos outputs."
            exit 1
          }

          echo "Stack atualizado: $STATUS"
          echo "Pre Token Generation: $PRE_TOKEN"
        working-directory: .

      - name: Credentialed browser CORS smoke test
        run: |
          set -euo pipefail
          API="https://${EXPECTED_API_ID}.execute-api.${AWS_REGION}.amazonaws.com"
          ORIGIN="https://obrigacoes.e3isolucoes.com.br"

          curl -sS -D /tmp/preflight.headers -o /tmp/preflight.body \
            -X OPTIONS "$API/v1/portal-session/exchange" \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"

          tr -d '\r' </tmp/preflight.headers >/tmp/preflight.clean
          grep -Fqi "access-control-allow-origin: $ORIGIN" /tmp/preflight.clean || {
            echo "CORS preflight sem Access-Control-Allow-Origin esperado."
            cat /tmp/preflight.clean
            exit 1
          }
          grep -Fqi "access-control-allow-credentials: true" /tmp/preflight.clean || {
            echo "CORS preflight sem Access-Control-Allow-Credentials: true."
            cat /tmp/preflight.clean
            exit 1
          }

          STATUS="$(curl -sS -D /tmp/refresh.headers -o /tmp/refresh.body -w '%{http_code}' \
            -X POST "$API/v1/session/refresh" \
            -H "Origin: $ORIGIN" \
            -H "Content-Type: application/json" \
            --data '{}')"

          test "$STATUS" = "204" || {
            echo "Esperado 204 em refresh sem cookie; recebido $STATUS"
            cat /tmp/refresh.body
            exit 1
          }

          tr -d '\r' </tmp/refresh.headers >/tmp/refresh.clean
          grep -Fqi "access-control-allow-origin: $ORIGIN" /tmp/refresh.clean || {
            echo "Resposta credentialed sem Access-Control-Allow-Origin esperado."
            cat /tmp/refresh.clean
            exit 1
          }
          grep -Fqi "access-control-allow-credentials: true" /tmp/refresh.clean || {
            echo "Resposta credentialed sem Access-Control-Allow-Credentials: true."
            cat /tmp/refresh.clean
            exit 1
          }

          echo "CORS credentialed validado para $ORIGIN."

          curl -sS -D /tmp/obligations-preflight.headers -o /tmp/obligations-preflight.body \
            -X OPTIONS "$API/v1/obligations?limit=1" \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: GET" \
            -H "Access-Control-Request-Headers: authorization,content-type,x-workspace-id"

          tr -d '\r' </tmp/obligations-preflight.headers >/tmp/obligations-preflight.clean
          grep -Fqi "access-control-allow-origin: $ORIGIN" /tmp/obligations-preflight.clean || {
            echo "CORS GET preflight sem Access-Control-Allow-Origin esperado."
            cat /tmp/obligations-preflight.clean
            exit 1
          }
          grep -Fqi "authorization" /tmp/obligations-preflight.clean || {
            echo "CORS GET preflight não permite header Authorization."
            cat /tmp/obligations-preflight.clean
            exit 1
          }
          grep -Fqi "x-workspace-id" /tmp/obligations-preflight.clean || {
            echo "CORS GET preflight não permite x-workspace-id."
            cat /tmp/obligations-preflight.clean
            exit 1
          }

          STATUS="$(curl -sS -D /tmp/obligations-401.headers -o /tmp/obligations-401.body -w '%{http_code}' \
            "$API/v1/obligations?limit=1" \
            -H "Origin: $ORIGIN")"
          test "$STATUS" = "401" || {
            echo "Esperado 401 sem token em obligations; recebido $STATUS"
            cat /tmp/obligations-401.body
            exit 1
          }
          tr -d '\r' </tmp/obligations-401.headers >/tmp/obligations-401.clean
          grep -Fqi "access-control-allow-origin: $ORIGIN" /tmp/obligations-401.clean || {
            echo "Resposta 401 sem CORS; o navegador converteria isso em erro operacional."
            cat /tmp/obligations-401.clean
            exit 1
          }

          for RESOURCE in profiles completions checklist_items categories tax_regimes obligation_date_overrides; do
            curl -sS -D "/tmp/${RESOURCE}-preflight.headers" -o "/tmp/${RESOURCE}-preflight.body" \
              -X OPTIONS "$API/v1/${RESOURCE}?limit=1" \
              -H "Origin: $ORIGIN" \
              -H "Access-Control-Request-Method: GET" \
              -H "Access-Control-Request-Headers: authorization,content-type,x-workspace-id"

            tr -d '\r' <"/tmp/${RESOURCE}-preflight.headers" >"/tmp/${RESOURCE}-preflight.clean"
            grep -Fqi "access-control-allow-origin: $ORIGIN" "/tmp/${RESOURCE}-preflight.clean" || {
              echo "CORS GET preflight ausente em ${RESOURCE}."
              cat "/tmp/${RESOURCE}-preflight.clean"
              exit 1
            }
          done

          echo "CORS operacional validado para sessão, preflight GET e erros 401."
        working-directory: .

      - name: Inspect live Portal iframe contract
        run: |
          set -euo pipefail
          rm -rf /tmp/portal-live && mkdir -p /tmp/portal-live
          curl -fsSL https://portal.e3isolucoes.com.br/ -o /tmp/portal-live/index.html

          python - <<'PY' >/tmp/portal-live/scripts.txt
          import re
          from urllib.parse import urljoin
          html=open('/tmp/portal-live/index.html', encoding='utf-8', errors='ignore').read()
          for src in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)', html, flags=re.I):
              print(urljoin('https://portal.e3isolucoes.com.br/', src))
          PY

          i=0
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            i=$((i+1))
            curl -fsSL "$url" -o "/tmp/portal-live/script-$i.js" || true
          done </tmp/portal-live/scripts.txt

          python - <<'PY'
          from pathlib import Path
          needles = [
              'Não foi possível carregar o painel agora.',
              'Failed to fetch',
              'allow-same-origin',
              'sandbox',
              'iframe',
              'portal_sso_code',
              '/api/client-tools',
              'launchUrl',
              'obrigacoes.e3isolucoes.com.br',
              'Painel de Obrigações E3I',
          ]
          found=[]
          for path in Path('/tmp/portal-live').glob('*'):
              if not path.is_file():
                  continue
              text=path.read_text(encoding='utf-8', errors='ignore')
              matches=[needle for needle in needles if needle in text]
              if matches:
                  found.append((path.name, matches))
                  for needle in matches:
                      pos=text.find(needle)
                      start=max(0,pos-3000)
                      end=min(len(text),pos+3000)
                      print(f'--- {path.name} :: {needle} ---')
                      print(text[start:end].replace('\n',' ')[:6000])
          print('PORTAL_LIVE_MATCHES=', found)
          PY
        working-directory: .

      - name: Unauthenticated API smoke test
        run: |
          set -euo pipefail
          STATUS="$(curl -sS -o /tmp/me.json -w '%{http_code}'             https://${EXPECTED_API_ID}.execute-api.${AWS_REGION}.amazonaws.com/v1/me)"

          test "$STATUS" = "401" || {
            echo "Esperado HTTP 401 sem token; recebido: $STATUS"
            cat /tmp/me.json
            exit 1
          }

          echo "API respondeu 401 sem autenticação, como esperado."
        working-directory: .
